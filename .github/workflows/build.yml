name: Build ROSE APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          found=false

          while IFS= read -r -d '' archive; do
            target="extracted/$(basename "$archive")"
            mkdir -p "$target"

            case "$archive" in
              *.zip)
                unzip -q "$archive" -d "$target"
                ;;
              *.gz|*.tgz)
                tar -xzf "$archive" -C "$target"
                ;;
              *.tar)
                tar -xf "$archive" -C "$target"
                ;;
              *)
                continue
                ;;
            esac

            project=$(find "$target" -name gradlew -type f -print -quit)

            if [ -n "$project" ]; then
              echo "PROJECT_DIR=$(dirname "$project")" >> "$GITHUB_ENV"
              found=true
              break
            fi
          done < <(find . -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.gz" -o -name "*.tgz" -o -name "*.tar" \) \
            -print0)

          if [ "$found" != true ]; then
            echo "Android project with gradlew was not found"
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rose-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
