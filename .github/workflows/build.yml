name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -xzf rose-android-0_2_0*.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - working-directory: rose-android-0.2.0
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rose-debug-apk
          path: rose-android-0.2.0/app/build/outputs/apk/debug/*.apk
