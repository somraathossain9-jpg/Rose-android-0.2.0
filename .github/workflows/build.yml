name: Build ROSE APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir extracted

          archive=$(find . -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) \
            | head -n 1)

          if [ -z "$archive" ]; then
            echo "Source archive not found"
            exit 1
          fi

          case "$archive" in
            *.zip) unzip -q "$archive" -d extracted ;;
            *) tar -xzf "$archive" -C extracted ;;
          esac

          project=$(find extracted -name gradlew -type f \
            -printf '%h\n' | head -n 1)

          if [ -z "$project" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rose-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
